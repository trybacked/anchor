name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install DuckDB CLI
        run: |
          set -euo pipefail
          version="1.5.6"
          curl -fsSL "https://github.com/duckdb/duckdb/releases/download/v${version}/duckdb_cli-linux-amd64.zip" -o /tmp/duckdb_cli.zip
          unzip -jo /tmp/duckdb_cli.zip -d /tmp/duckdb_cli
          sudo install -m 755 /tmp/duckdb_cli/duckdb /usr/local/bin/duckdb
          duckdb --version

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Generate JSON Schema
        run: pnpm generate:schema

      - name: Verify schema artifact is committed
        run: git diff --exit-code schema/anchor-schema-v1.json

      - name: Generate OpenAPI
        run: pnpm --filter @trybacked/api-server generate:openapi

      - name: Verify OpenAPI artifact is committed
        run: git diff --exit-code apps/api-server/openapi.json

      - name: Guardrails
        run: pnpm guardrails

      - name: Test with coverage
        run: pnpm test:coverage
