name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Generate JSON Schema
        run: pnpm generate:schema

      - name: Verify schema artifact is committed
        run: git diff --exit-code schema/anchor-schema-v1.json

      - name: Verify Anchor SDK OpenAPI types match worker spec
        run: |
          pnpm --filter @trybacked/anchor generate:openapi
          git diff --exit-code packages/anchor/src/generated/openapi.d.ts

      - name: Test with coverage
        run: pnpm test:coverage
